<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="StockMS — Stock in, stock out, no spreadsheets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect x="760" width="520" height="320" fill="url(#dots)"/>
  <ellipse cx="1080" cy="160" rx="330" ry="260" fill="url(#glow)"/>
  <g fill="none" stroke="#60A5FA" stroke-opacity="0.22" stroke-width="1.5">
    <circle cx="1080" cy="160" r="70"/>
    <circle cx="1080" cy="160" r="120"/>
    <circle cx="1080" cy="160" r="176"/>
  </g>
  <circle cx="1080" cy="160" r="8" fill="#60A5FA" fill-opacity="0.9"/>

  <rect x="64" y="96" width="128" height="128" rx="32" fill="url(#mark)"/>
  <text x="128" y="162" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-2" fill="#ffffff">ST</text>

  <text x="224" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700"
        letter-spacing="-1.2" fill="#F8FAFC">StockMS</text>
  <text x="224" y="192" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400"
        fill="#94A3B8">Stock in, stock out, no spreadsheets</text>
  <text x="226" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600"
        letter-spacing="2.6" fill="#60A5FA">LARAVEL · INVENTORY</text>

  <rect x="0" y="316" width="1280" height="4" fill="url(#mark)" fill-opacity="0.85"/>
</svg>
